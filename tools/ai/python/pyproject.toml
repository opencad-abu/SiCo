[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cadai"
version = "0.1.0"
description = "Virtuoso session bridge for interactive Codex and Claude agents"
requires-python = ">=3.9"
dependencies = ["rfc8785==0.1.4"]

[tool.setuptools.packages.find]
include = ["cadai", "cadai.*"]

[project.optional-dependencies]
templates = ["networkx==3.2.1"]

[project.scripts]
sico-ai = "cadai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
