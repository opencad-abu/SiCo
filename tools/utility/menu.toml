[settings]
logo_env = "LOGO"
default_logo = "SiCo"

[ciw]
enabled = true
title = "SiCo"

[[ciw.items]]
name = "aiAssistantAgent"
text = "Silicon Copilot"
callback = "(witMenuLoadRelative \"sico/skill++/SICO.ils\") (when (isCallable 'sicoShow) (sicoShow))"

[[ciw.items]]
name = "aiAssistant"
text = "AI Assistant"
callback = "(witMenuLoadRelative \"ai/skill++/AI.ils\") (when (isCallable 'cadDisplayAiAssistant) (cadDisplayAiAssistant))"

