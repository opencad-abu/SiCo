[run]
branch = True
parallel = True
concurrency = multiprocessing
source =
    tools/sico/python/sico
    tools/sico/python/sico_ui
    tools/ai/python/cadai
    tools/ai/terminal/pyqt/cad_ai_terminal
    tools/ai/skills/schematic-to-rnm/scripts
    tools/common/python
    tools/drc/python/drcpy
    tools/rce/python/rcepy
    tools/lvs/python/lvspy
    tools/lef/python/lefpy
    tools/mtsnl/python/mtsnetlistor
    tools/utility
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    tools/mtsnl/python/mtsnetlistor/_vendor/*
    tools/utility/tests/*

[report]
precision = 2
skip_empty = True
